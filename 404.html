<style>

  p { color: rgba(245, 233, 217, .82); margin-bottom: 32px; }
  .acoes { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  a.btn {
    display: inline-flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 26px;
    border-radius: 999px; font-weight: 600; text-decoration: none;

  .btn-wa { background: var(--wa); color: var(--wa-texto); }
  .btn-volta { border: 1px solid rgba(226, 194, 156, .5); color: var(--creme); }
